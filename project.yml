name: Raskladushka
options:
  bundleIdPrefix: com.alexey.duzhev
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ru
  createIntermediateGroups: true
packages:
  SwitcherCore:
    path: Packages/SwitcherCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Raskladushka:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SwitcherCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Раскладушка
        CFBundleName: Раскладушка
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Aleksei Diuzhev
    entitlements:
      path: App/Raskladushka.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexey.duzhev.raskladushka
        PRODUCT_NAME: Raskladushka
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
